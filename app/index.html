<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrimWeaver 1.82</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v1.css"><link rel="stylesheet" href="v11.css"><link rel="stylesheet" href="ui-v12.css"><link rel="stylesheet" href="ui-v13.css"><link rel="stylesheet" href="ui-v14.css"><link rel="stylesheet" href="ui-v15.css"><link rel="stylesheet" href="ui-v16.css"><link rel="stylesheet" href="ui-v17.css"><link rel="stylesheet" href="ui-v171.css"><link rel="stylesheet" href="ui-v18.css"><link rel="stylesheet" href="ui-v181.css"><link rel="stylesheet" href="ui-v182.css"><link rel="icon" href="assets/brand/GrimWeaver.ico"></head>
<body><header class="topbar"><div class="brand"><i data-lucide="layers-3"></i><strong id="brand">GrimWeaver</strong><span class="version">1.82</span></div><div class="environment">GAL v97d <span class="status-dot"></span><span data-i18n="offline">离线</span></div><div class="top-actions"><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option></select><button id="themeButton" class="icon-button" title="切换明暗界面"><i data-lucide="sun-moon"></i></button><button id="settingsButton" class="icon-button" title="设置"><i data-lucide="settings-2"></i></button></div></header>
<div class="buildbar"><input id="buildName" data-placeholder="buildName" placeholder="未命名构筑" aria-label="Build name"><div class="build-actions"><button id="newBuild" title="新建" class="icon-button"><i data-lucide="file-plus-2"></i></button><button id="saveBuild" title="保存" class="icon-button"><i data-lucide="save"></i></button><button id="undo" title="撤销" class="icon-button"><i data-lucide="undo-2"></i></button><button id="redo" title="重做" class="icon-button"><i data-lucide="redo-2"></i></button><span class="separator"></span><button id="importBuild"><i data-lucide="folder-open"></i><span data-i18n="import">导入</span></button><button id="exportBuild"><i data-lucide="download"></i><span data-i18n="export">导出</span></button><button id="shareBuild"><i data-lucide="share-2"></i><span data-i18n="share">分享</span></button></div><select id="savedBuilds" aria-label="Saved builds"><option value="" data-i18n="savedBuilds">已保存构筑</option></select></div>
<nav class="view-tabs"><button data-view="equipment" class="active"><i data-lucide="shield"></i><span data-i18n="equipment">装备</span></button><button data-view="skills"><i data-lucide="swords"></i><span data-i18n="skills">技能</span></button><button data-view="devotions"><i data-lucide="sparkles"></i><span data-i18n="devotions">星座</span></button></nav>
<main class="workspace"><aside class="character"><div class="section-head"><h2 data-i18n="character">角色</h2><div class="level-field"><label for="level" data-i18n="level">等级</label><input type="number" id="level" min="1" max="100" value="100"></div></div><div id="characterClass"></div><div id="attributes"></div><div id="attributePoints" class="point-counter"></div><div id="vitals"></div><div class="character-bottom"><select id="difficulty" aria-label="Difficulty"><option value="normal" data-i18n="normal">普通</option><option value="elite" data-i18n="elite">精英</option><option value="ultimate" data-i18n="ultimate">终极</option><option value="ascendant" data-i18n="ascendant">飞升</option></select><button id="baselineButton" title="设为比较基准" class="icon-button"><i data-lucide="git-compare-arrows"></i></button></div><div class="section-head"><h3 data-i18n="checks">构筑检查</h3></div><div id="warnings"></div><details class="raw-details"><summary data-i18n="sourceLedger">属性来源</summary><div id="ledger"></div></details></aside>
<section class="editor"><div id="gearPanel"><div class="gear-toolbar"><h2 data-i18n="equipment">装备</h2><div class="segmented"><button data-weapon="1" class="active">I</button><button data-weapon="2">II</button></div></div><div class="paper-viewport"><div id="equipmentSlots" class="paper-doll"></div></div><div id="gearSummary"></div></div><div id="editorContent"></div></section>
<aside class="results"><div class="section-head"><h2 data-i18n="panel">角色面板</h2><span class="model-label" data-i18n="preview">预估</span></div><div id="statTabs"></div><div id="summaryStats"></div><div id="resistances"></div><div id="petBonuses" hidden></div></aside></main>
<footer><span id="status" role="status">加载数据包…</span><span id="loadedCount"></span></footer>
<dialog id="catalogDialog"><div class="dialog-head"><h2 id="catalogTitle">装备</h2><button data-close="catalogDialog" class="icon-button" title="关闭"><i data-lucide="x"></i></button></div><div id="catalogContent"></div></dialog>
<dialog id="settingsDialog"><div class="dialog-head"><h2 data-i18n="settings">设置</h2><button data-close="settingsDialog" class="icon-button" title="关闭"><i data-lucide="x"></i></button></div><div id="settingsFields"></div></dialog>
<dialog id="shareDialog"><div class="dialog-head"><h2 data-i18n="share">分享</h2><button data-close="shareDialog" class="icon-button" title="关闭"><i data-lucide="x"></i></button></div><div class="dialog-body"><label data-i18n="shareCode">离线分享码</label><textarea id="shareCode" rows="6" spellcheck="false"></textarea><div class="dialog-actions"><button id="copyCode"><i data-lucide="copy"></i><span data-i18n="copy">复制</span></button><button id="loadCode"><i data-lucide="arrow-down-to-line"></i><span data-i18n="loadCode">载入分享码</span></button></div><label data-i18n="selfLink">自包含链接</label><textarea id="shareLink" rows="3" readonly></textarea><p class="notice" data-i18n="shortLinkStatus">服务器短链：未配置</p></div></dialog>
<dialog id="planDialog"><div class="dialog-head"><h2 data-i18n="buildOrder">加点路径</h2><button data-close="planDialog" class="icon-button" title="关闭"><i data-lucide="x"></i></button></div><div id="planContent" class="dialog-body"></div></dialog>
<dialog id="confirmDialog"><form method="dialog"><div class="dialog-body"><p id="confirmMessage"></p><div class="dialog-actions"><button id="cancelConfirm" value="cancel">取消</button><button id="acceptConfirm" value="confirm">确认</button></div></div></form></dialog>
<div id="tooltip" hidden></div><input type="file" id="fileInput" accept=".json,.dawnbuild,.gdc" hidden>
<script src="../lucide.min.js"></script><script src="data/manifest.js"></script><script src="data/presentation.js"></script><script src="rem-data.js"></script><script src="arc-reader.js"></script><script src="stat-text.js"></script><script src="core.js"></script><script src="combat.js"></script><script src="build-model.js"></script><script src="scenario-model.js"></script><script src="save-reader.js"></script><script src="save-import.js"></script><script src="catalog-model.js"></script><script src="conversion-model.js"></script><script src="summon-model.js"></script><script src="skill-damage.js"></script><script src="pet-damage.js"></script><script src="damage-summary.js"></script><script src="data-loader.js"></script><script src="build-document.js"></script><script src="effect-model.js"></script><script src="presentation-model.js"></script><script src="preferences.js"></script><script src="app.js"></script><script src="v1.js"></script><script src="v11.js"></script><script src="ui-v12.js"></script><script src="ui-v13.js"></script><script src="ui-v14.js"></script><script src="ui-v15.js"></script><script src="ui-v16.js"></script><script src="ui-v17.js"></script><script src="ui-v171.js"></script><script src="ui-v18.js"></script><script src="ui-v181.js"></script><script src="ui-v182.js"></script></body></html>
